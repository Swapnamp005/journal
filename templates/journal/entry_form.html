<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Entry</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; line-height: 1.6; }
        form { max-width: 500px; }
        input, textarea { width: 100%; padding: 0.6rem; margin-bottom: 0.8rem; }
        button { padding: 0.6rem 1rem; }
    </style>
</head>
<body>
    <h1>Write a New Journal Entry</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Entry</button>
    </form>
    <p><a href="{% url 'journal:entry_list' %}">Cancel</a></p>
</body>
</html>
